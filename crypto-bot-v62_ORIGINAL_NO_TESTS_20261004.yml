name: Crypto Signal Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_ONCE: "1"
      TELEGRAM_TEST_ON_START: "0"
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tehran
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests pandas numpy pyyaml

      - name: Verify v62 source
        run: |
          set -euo pipefail
          test -f main.py
          python --version
          python -m py_compile main.py
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path("main.py").read_text(encoding="utf-8")
          ast.parse(source, filename="main.py")
          required = [
              "professional_signal_quality_gate",
              "professional_quality_grade",
              "PRO_MIN_SCORE = 90",
              "PRO_SELL_MIN_SCORE = 92",
              "PRO_BOTTOM_MIN_SCORE = 90",
              "PRO_MIN_QUALITY_POINTS = 14",
              "PRO_BOTTOM_MIN_QUALITY_POINTS = 14",
              "PRO_MIN_VOLUME_RATIO = 1.35",
              "PRO_SELL_MIN_VOLUME_RATIO = 1.50",
              "PRO_MIN_30M_CONFIRMATIONS = 6",
              "PRO_SELL_MIN_30M_CONFIRMATIONS = 6",
              "PRO_MAX_EMA21_DISTANCE = 4.00",
              "PRO_MAX_EMA200_DISTANCE = 12.00",
              "PRO_SELL_MIN_HTF_ALIGNMENT = 2",
              'required_grade = "A+"',
              "BTC_CONTEXT_ONLY",
              "BTC_SYMBOL",
          ]
          missing = [x for x in required if x not in source]
          if missing:
              raise SystemExit("Missing v62 root markers: " + ", ".join(missing))
          print("AST + v62 markers: PASS")
          print("Lines:", len(source.splitlines()))
          print("Bytes:", len(source.encode("utf-8")))
          PY

      - name: Import test
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("crypto_signal_bot", "main.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print("Module import: PASS")
          PY

      - name: Root behavior tests
        run: |
          set -euo pipefail
          test -f test_v62_root.py
          python test_v62_root.py

      - name: Run Crypto Signal Bot v62
        run: |
          set -euo pipefail
          python main.py
