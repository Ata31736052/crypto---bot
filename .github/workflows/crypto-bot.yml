name: Crypto Signal Bot v63.7

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RUN_ONCE: "1"
      TELEGRAM_TEST_ON_START: "0"
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tehran
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests pandas numpy pyyaml

      - name: Verify deployed v63.7 build
        run: |
          set -euo pipefail
          test -f main.py
          python -m py_compile main.py
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")
          ast.parse(source, filename="main.py")

          required = [
              'Version: 2026-10-04 v63.7 | FINAL GATE TRUTHFUL DIAGNOSTICS | RR FLOAT-SAFE',
              'DEPLOYMENT_ID = "v63.7-final-gate-float-safe-20261004"',
              'def record_professional_rejection',
              'def run_v63_6_rr_boundary_self_test',
              'def run_v63_7_final_gate_self_test',
              'def professional_signal_quality_gate',
              'def final_telegram_quality_gate',
              'def validate_risk_levels',
              'PRO_MIN_SCORE = 90',
              'PRO_MIN_QUALITY_POINTS = 15',
          ]

          missing = [x for x in required if x not in source]
          if missing:
              raise SystemExit("Missing v63.7 deployment markers: " + ", ".join(missing))

          print("DEPLOYMENT SOURCE: v63.7-final-gate-float-safe-20261004")
          print("AST + v63.7 deployment markers: PASS")
          print("Lines:", len(source.splitlines()))
          print("Bytes:", len(source.encode("utf-8")))
          PY

      - name: Import and v63.7 self-tests
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location("crypto_signal_bot", "main.py")
          if spec is None or spec.loader is None:
              raise SystemExit("Cannot load main.py")

          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          assert module.DEPLOYMENT_ID == "v63.7-final-gate-float-safe-20261004"
          assert callable(module.professional_signal_quality_gate)
          assert callable(module.final_telegram_quality_gate)
          assert callable(module.record_professional_rejection)
          assert callable(module.run_v63_6_rr_boundary_self_test)
          assert callable(module.run_v63_7_final_gate_self_test)

          assert module.run_v63_6_rr_boundary_self_test() is True
          assert module.run_v63_7_final_gate_self_test() is True

          diagnostic = {}
          signal = {
              "signal": "BUY",
              "signal_mode": "TREND",
              "score": 88,
              "professional_quality_breakdown": {
                  "raw_score": 88,
                  "quality_points": 11,
                  "quality_score": 82,
                  "grade": "C",
                  "adx": 19.5,
                  "volume_ratio": 1.10,
                  "confirmations_30m": 4,
                  "required_30m": 6,
                  "htf_alignment": 0,
                  "required_htf_alignment": 1,
                  "rr_tp1": 1.80,
                  "rr_tp2": 2.40,
                  "reject_reasons": ["low volume"],
              },
          }

          module.record_professional_rejection(
              diagnostic, "TEST", signal, ["low volume"], 82
          )

          assert diagnostic["professional_score_80_89"] == 1
          assert diagnostic["professional_quality_points_9_11"] == 1
          assert diagnostic["professional_reject_details"][0]["adx"] == 19.5
          assert diagnostic["professional_reject_details"][0]["raw_score"] == 88

          print("IMPORT + RR SELF-TEST + FINAL-GATE SELF-TEST: PASS")
          print("DIAGNOSTIC RECORD SELF-TEST: PASS")
          PY

      - name: Run Crypto Signal Bot v63.7
        run: |
          set -euo pipefail
          python main.py
