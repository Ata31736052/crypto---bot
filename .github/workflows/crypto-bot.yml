name: Crypto Signal Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    env:
      RUN_ONCE: "1"
      TELEGRAM_TEST_ON_START: "0"
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tehran

      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # PYTHON
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install \
            requests \
            pandas \
            numpy \
            pyyaml

      # ==========================================
      # ROOT VERIFICATION
      # ==========================================
      - name: Verify Crypto Signal Bot v60
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING CRYPTO SIGNAL BOT v60"
          echo "=========================================="

          test -f main.py

          echo "File:"
          ls -lh main.py

          echo
          echo "Python:"
          python --version

          echo
          echo "Checking Python syntax..."
          python -m py_compile main.py
          echo "Python syntax: OK"

          echo
          echo "Checking AST..."

          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("main.py")
          source = path.read_text(encoding="utf-8")

          ast.parse(source)

          print("AST: OK")
          print("Bytes:", len(source.encode("utf-8")))
          print("Lines:", len(source.splitlines()))
          PY

          # ======================================
          # VERSION CHECK
          # ======================================

          echo
          echo "Checking v60 markers..."

          grep -q "v60" main.py

          echo "v60 marker: OK"

          # ======================================
          # COMPOSITE QUALITY GATE CHECK
          # ======================================

          echo
          echo "Checking Composite Professional Quality Gate..."

          python - <<'PY'
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")

          required = [
              "professional_signal_quality_gate",
              "PRO_MIN_SCORE",
              "PRO_SELL_MIN_SCORE",
              "PRO_MIN_VOLUME_RATIO",
              "PRO_MIN_30M_CONFIRMATIONS",
              "PRO_MIN_QUALITY_POINTS",
              "PRO_BOTTOM_MIN_QUALITY_POINTS",
          ]

          missing = [
              item
              for item in required
              if item not in source
          ]

          if missing:
              raise SystemExit(
                  "ERROR: Missing quality markers: "
                  + ", ".join(missing)
              )

          print("Composite Quality Gate: OK")
          PY

          # ======================================
          # BTC CONTEXT-ONLY CHECK
          # ======================================

          echo
          echo "Checking BTC context-only protection..."

          python - <<'PY'
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")

          required = [
              "BTCUSDT",
              "BTC",
              "context",
          ]

          missing = [
              item
              for item in required
              if item not in source
          ]

          if missing:
              raise SystemExit(
                  "ERROR: BTC/context protection markers missing: "
                  + ", ".join(missing)
              )

          print("BTC context protection markers: OK")
          PY

          # ======================================
          # PROFESSIONAL FILTER CHECK
          # ======================================

          echo
          echo "Checking professional filters..."

          python - <<'PY'
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")

          required = [
              "ADX",
              "volume",
              "30M",
              "higher",
              "momentum",
              "RR",
          ]

          for item in required:
              if item.lower() not in source.lower():
                  raise SystemExit(
                      f"ERROR: Professional filter marker missing: {item}"
                  )

          print("Professional filters: OK")
          PY

          # ======================================
          # IMPORT TEST
          # ======================================

          echo
          echo "Checking module import..."

          python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location(
              "crypto_signal_bot",
              "main.py"
          )

          module = importlib.util.module_from_spec(spec)

          spec.loader.exec_module(module)

          print("Module import: OK")
          PY

          # ======================================
          # FINAL VERIFICATION
          # ======================================

          echo
          echo "=========================================="
          echo "v60 VERIFICATION PASSED"
          echo "=========================================="

      # ==========================================
      # RUN BOT
      # ==========================================
      - name: Run Crypto Signal Bot v60
        run: |
          set -e

          echo "=========================================="
          echo "RUNNING CRYPTO SIGNAL BOT v60"
          echo "=========================================="

          python main.py

          echo "=========================================="
          echo "BOT FINISHED"
          echo "=========================================="
