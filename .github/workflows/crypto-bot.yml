name: Crypto Signal Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    env:
      RUN_ONCE: "1"
      TELEGRAM_TEST_ON_START: "0"
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tehran
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Verify main.py
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING main.py - v58"
          echo "=========================================="

          test -f main.py

          echo "File:"
          ls -lh main.py

          echo "Python:"
          python --version

          echo "Checking Python syntax..."
          python -m py_compile main.py
          echo "Python syntax: OK"

          echo "Checking AST..."
          python - <<'PY'
          import ast

          with open("main.py", "r", encoding="utf-8") as f:
              source = f.read()

          ast.parse(source)

          print("AST: OK")
          print("Bytes:", len(source.encode("utf-8")))
          print("Lines:", len(source.splitlines()))
          PY

          echo "Checking v58 markers..."
          grep -q "v58" main.py
          grep -q "PRO_MIN_SCORE = 78" main.py
          grep -q "PRO_SELL_MIN_SCORE = 82" main.py

          echo "v58 markers: OK"

          echo "Checking BTC context-only protection..."
          python - <<'PY'
          from pathlib import Path

          s = Path("main.py").read_text(encoding="utf-8")

          checks = [
              "BTCUSDT",
              "BTC",
              "context",
          ]

          for item in checks:
              if item not in s:
                  raise SystemExit(
                      f"ERROR: required BTC/context marker missing: {item}"
                  )

          print("BTC/context markers: OK")
          PY

          echo "=========================================="
          echo "VERIFICATION PASSED"
          echo "=========================================="

      - name: Run Crypto Signal Bot
        run: |
          set -e

          echo "=========================================="
          echo "RUNNING CRYPTO SIGNAL BOT v58"
          echo "=========================================="

          python main.py

          echo "=========================================="
          echo "BOT FINISHED"
          echo "=========================================="
