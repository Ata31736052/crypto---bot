name: Crypto Signal Bot

on:
  workflow_dispatch:

  schedule:
    - cron: '0,30 * * * *'
      timezone: 'Asia/Tehran'

permissions:
  contents: write

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # GitHub در هر اجرا فقط یک اسکن انجام می‌دهد
      RUN_ONCE: '1'

      # پیام تست Telegram ارسال نشود
      TELEGRAM_TEST_ON_START: '0'

      TZ: Asia/Tehran
      PYTHONUNBUFFERED: '1'

    steps:

      # ==========================================
      # 1. دریافت آخرین کد
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================
      # 2. نصب Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      # ==========================================
      # 3. نصب وابستگی‌ها
      # ==========================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # 4. بررسی Syntax قبل از اجرای ربات
      # ==========================================
      - name: Check Python syntax
        run: |
          python -m py_compile main.py
          echo "Python syntax: OK"

      # ==========================================
      # 5. اجرای اسکن
      # ==========================================
      - name: Run 1H Trend + Bottom Hunter scanner
        run: |
          python main.py

      # ==========================================
      # 6. ذخیره State و History
      # ==========================================
      - name: Commit signal state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add signals_state.json signals_history.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update signal state [skip ci]"
          git push
