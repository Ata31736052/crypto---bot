name: Crypto Signal Bot

on:
  workflow_dispatch:

  schedule:
    # اجرا در دقیقه 00 هر ساعت
    - cron: "0 * * * *"

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RUN_ONCE: "1"
      TELEGRAM_TEST_ON_START: "0"
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tehran

      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # PYTHON
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # =====================================================
      # DEPENDENCIES
      # =====================================================
      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            requests \
            pandas \
            numpy \
            pyyaml

      # =====================================================
      # ROOT VERIFICATION
      # =====================================================
      - name: Verify Crypto Signal Bot v61
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING CRYPTO SIGNAL BOT v61"
          echo "=========================================="

          test -f main.py

          echo
          echo "File:"
          ls -lh main.py

          echo
          echo "Python:"
          python --version

          # -------------------------------------------------
          # Syntax
          # -------------------------------------------------
          echo
          echo "Checking Python syntax..."

          python -m py_compile main.py

          echo "Python syntax: PASS"

          # -------------------------------------------------
          # AST
          # -------------------------------------------------
          echo
          echo "Checking AST..."

          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")
          ast.parse(source)

          print("AST: PASS")
          print("Lines:", len(source.splitlines()))
          print("Bytes:", len(source.encode("utf-8")))
          PY

          # -------------------------------------------------
          # VERSION
          # -------------------------------------------------
          echo
          echo "Checking v61..."

          grep -Fq "v61" main.py

          echo "v61 marker: PASS"

          # -------------------------------------------------
          # ROOT QUALITY ENGINE
          # -------------------------------------------------
          echo
          echo "Checking root quality engine..."

          python - <<'PY'
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")

          required = [
              "professional_signal_quality_gate",
              "PRO_MIN_SCORE",
              "PRO_SELL_MIN_SCORE",
              "PRO_BOTTOM_MIN_SCORE",
              "PRO_MIN_QUALITY_POINTS",
              "PRO_BOTTOM_MIN_QUALITY_POINTS",
              "PRO_MAX_EMA21_DISTANCE",
              "PRO_MAX_EMA200_DISTANCE",
              "PRO_MIN_VOLUME_RATIO",
              "PRO_MIN_30M_CONFIRMATIONS",
              "PRO_MIN_HTF_ALIGNMENT",
              "professional_quality_grade",
          ]

          missing = [
              item for item in required
              if item not in source
          ]

          if missing:
              raise SystemExit(
                  "Missing v61 quality markers: "
                  + ", ".join(missing)
              )

          print("Root quality engine: PASS")
          PY

          # -------------------------------------------------
          # BTC CONTEXT ONLY
          # -------------------------------------------------
          echo
          echo "Checking BTC context-only protection..."

          python - <<'PY'
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")

          required = [
              "BTC_SYMBOL",
              "BTCUSDT",
              "context-only",
          ]

          missing = [
              item for item in required
              if item.lower() not in source.lower()
          ]

          if missing:
              raise SystemExit(
                  "BTC protection markers missing: "
                  + ", ".join(missing)
              )

          print("BTC context-only protection: PASS")
          PY

          # -------------------------------------------------
          # PROFESSIONAL FILTERS
          # -------------------------------------------------
          echo
          echo "Checking professional filters..."

          python - <<'PY'
          from pathlib import Path

          source = Path("main.py").read_text(
              encoding="utf-8"
          ).lower()

          required = [
              "adx",
              "volume",
              "30m",
              "higher-timeframe",
              "momentum",
              "ema21",
              "ema200",
              "rr",
              "quality",
              "sell",
          ]

          missing = [
              item for item in required
              if item not in source
          ]

          if missing:
              raise SystemExit(
                  "Professional filter markers missing: "
                  + ", ".join(missing)
              )

          print("Professional filters: PASS")
          PY

          # -------------------------------------------------
          # IMPORT TEST
          # -------------------------------------------------
          echo
          echo "Checking module import..."

          python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location(
              "crypto_signal_bot",
              "main.py"
          )

          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          print("Module import: PASS")
          PY

          # -------------------------------------------------
          # DETERMINISTIC ROOT TESTS
          # -------------------------------------------------
          echo
          echo "Running deterministic v61 root tests..."

          if [ -f test_v61_root.py ]; then
              python test_v61_root.py
          else
              echo "WARNING: test_v61_root.py not found."
              echo "Static verification will continue."
          fi

          # -------------------------------------------------
          # FINAL VERIFICATION
          # -------------------------------------------------
          echo
          echo "=========================================="
          echo "v61 VERIFICATION PASSED"
          echo "=========================================="

      # =====================================================
      # RUN BOT
      # =====================================================
      - name: Run Crypto Signal Bot v61
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RUNNING CRYPTO SIGNAL BOT v61"
          echo "=========================================="

          python main.py

          echo
          echo "=========================================="
          echo "CRYPTO SIGNAL BOT v61 FINISHED"
          echo "=========================================="
