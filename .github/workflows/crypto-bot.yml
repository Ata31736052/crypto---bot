name: Crypto Signal Bot v63.6

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RUN_ONCE: "1"
      TELEGRAM_TEST_ON_START: "0"
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tehran
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy pyyaml

      - name: Verify v63.6
        run: |
          set -euo pipefail

          test -f main.py
          python -m py_compile main.py

          python - <<'PY'
          from pathlib import Path
          import ast

          source = Path("main.py").read_text(encoding="utf-8")
          ast.parse(source, filename="main.py")

          required = [
              "v63.6",
              "TRUTHFUL PROFESSIONAL DIAGNOSTICS",
              "v63.6-truthful-professional-diagnostics-20261004",
              "professional_signal_quality_gate",
              "final_telegram_quality_gate",
          ]

          missing = [x for x in required if x not in source]

          if missing:
              raise SystemExit(
                  "Missing v63.6 markers: " + ", ".join(missing)
              )

          print("v63.6 verification: PASS")
          PY

      - name: Import test
        run: |
          set -euo pipefail

          python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location(
              "crypto_signal_bot",
              "main.py"
          )

          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          assert module.DEPLOYMENT_ID == \
              "v63.6-truthful-professional-diagnostics-20261004"

          print("Import test: PASS")
          PY

      - name: Run Crypto Signal Bot
        run: |
          set -euo pipefail
          python main.py
