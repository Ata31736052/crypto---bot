name: Crypto Signal Bot v63.14.9 | Engine Rejection Trace

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '7 * * * *'
      timezone: 'Asia/Tehran'

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_ONCE: '1'
      TELEGRAM_TEST_ON_START: '0'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install requests pandas numpy
          fi

      - name: Verify source identity and configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f main.py ]; then
            echo "ERROR: main.py is missing at repository root."
            echo "Python files found:"
            find . -maxdepth 3 -type f -name '*.py' -print | sort
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('main.py').read_text(encoding='utf-8')
          checks = {
              'v63.14.8 deployment marker': 'DEPLOYMENT_ID = "v63.14.9-engine-rejection-trace-20261010"' in source,
              'Bottom RSI lower bound': re.search(r'^BOTTOM_RSI_MIN\s*=\s*20\s*$', source, re.M) is not None,
              'Bottom RSI upper bound': re.search(r'^BOTTOM_RSI_MAX\s*=\s*44\s*$', source, re.M) is not None,
              'shared professional RSI gate': 'rsi_ok = (BOTTOM_RSI_MIN <= rsi <= BOTTOM_RSI_MAX) if side == "BUY" else (56 <= rsi <= 76)' in source,
              'RSI regression self-test': 'def run_v63_14_2_bottom_rsi_self_test():' in source,
              'outcome boundary regression self-test': 'def run_v63_14_3_outcome_boundary_self_test():' in source,
              'confirmation formatter exists': 'def format_confirmation_status(actual, required):' in source,
              'shared mode-aware score threshold': 'def professional_min_score_for_mode(mode, side):' in source and source.count('professional_min_score_for_mode(mode, side)') >= 2,
              'explicit final-gate rejection reasons': 'final_telegram_gate_rejections' in source,
              'confirmation diagnostic labels minimum clearly': 'required >= {required}' in source and 'actual={confirmations}; required>=' in source,
              'final gate root-consistency regression test': 'def run_v63_14_7_final_gate_consistency_self_test():' in source,
              'confirmation diagnostic truth regression test': 'def run_v63_14_8_confirmation_diagnostic_self_test():' in source,
              'engine rejection trace regression test': 'def run_v63_14_9_engine_rejection_trace_self_test():' in source,
              'historical outcome bypasses live freshness': 'historical_window = _is_anchored_historical_window(start_time_ms, end_time_ms)' in source and 'def _is_anchored_historical_window(' in source,
              'freshness remains enforced for live requests': 'if not historical_window:' in source and 'STALE DATA:' in source,
              'horizon boundary excludes next candle': 'future["open_time"] < horizon_end' in source,
              '8H boundary excludes next candle': 'future["open_time"] < final_end' in source,
              'outcome schema version bumped': 'record["outcome_engine_version"] = 55' in source,
              'historical klines use anchored time window': 'start_time_ms=start_ms' in source and 'end_time_ms=end_ms' in source,
              'outcome fetch uses Binance startTime/endTime': 'params["startTime"] = int(start_time_ms)' in source and 'params["endTime"] = int(end_time_ms)' in source,
              'horizon coverage is reported': 'horizon_coverage_8H=' in source,
              'outcome fetch window self-test': 'def _outcome_window_ms(candle_ts):' in source,
              'incomplete horizon payloads are repaired': 'def _has_complete_outcome_horizons(record):' in source and '_has_complete_outcome_horizons(record)' in source,
              'legacy outcome migration': 'complete_v55' in source,
              'score rejection continues to other diagnostics': 'Diagnostic-only root fix: record the score failure but continue evaluating' in source,
              'score gate unchanged': 'PRO_MIN_SCORE = 90' in source,
              'sell score gate unchanged': 'PRO_SELL_MIN_SCORE = 92' in source,
              'ADX gate unchanged': 'PRO_MIN_1H_ADX = 23.0' in source,
              'volume gate unchanged': 'PRO_MIN_VOLUME_RATIO = 1.35' in source,
          }
          for label, passed in checks.items():
              print(f"{'PASS' if passed else 'FAIL'}: {label}")
          failed = [label for label, passed in checks.items() if not passed]
          if failed:
              raise SystemExit('Source verification failed: ' + ', '.join(failed))
          print('Source identity/configuration: PASS')
          PY
          python -m py_compile main.py
          echo "Python compile: PASS"

      - name: Run regression self-tests without scanning
        shell: bash
        run: |
          set -euo pipefail
          RUN_ONCE=0 TELEGRAM_TEST_ON_START=0 python - <<'PY'
          import main
          tests = [
              ('v63.9 diagnostic integrity', main.run_v63_9_diagnostic_integrity_self_test),
              ('v63.10 root fix', main.run_v63_10_root_fix_self_test),
              ('v63.12 root fix', main.run_v63_12_root_fix3_self_test),
              ('v63.14 diagnostic trace', main.run_v63_14_diagnostic_trace_self_test),
              ('v63.14.1 root fix', main.run_v63_14_1_root_fix_self_test),
              ('v63.14.2 Bottom RSI regression', main.run_v63_14_2_bottom_rsi_self_test),
              ('v63.14.3 outcome boundary + v63.14.5 historical freshness', main.run_v63_14_3_outcome_boundary_self_test),
              ('v63.14.7 final gate root consistency', main.run_v63_14_7_final_gate_consistency_self_test),
              ('v63.14.8 confirmation diagnostic truth', main.run_v63_14_8_confirmation_diagnostic_self_test),
              ('v63.14.9 engine rejection trace', main.run_v63_14_9_engine_rejection_trace_self_test),
          ]
          for label, test in tests:
              assert test() is True, f'{label} failed'
              print(f'PASS: {label}')
          print('ALL REGRESSION SELF-TESTS: PASS')
          print('RSI bounds:', main.BOTTOM_RSI_MIN, main.BOTTOM_RSI_MAX)
          print('Core gates:', main.PRO_MIN_SCORE, main.PRO_MIN_1H_ADX,
                main.PRO_MIN_VOLUME_RATIO, main.PRO_MIN_30M_CONFIRMATIONS)
          PY

      - name: Run one closed-candle scan
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python main.py

      - name: Upload scan diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-bot-diagnostics-v63.14.9-${{ github.run_number }}
          path: |
            professional_diagnostics.txt
            symbol_diagnostics.txt
          if-no-files-found: warn
          retention-days: 7
