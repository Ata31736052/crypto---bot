name: Crypto Signal Bot

on:
  workflow_dispatch:

  schedule:
    - cron: '0,30 * * * *'
      timezone: 'Asia/Tehran'

permissions:
  contents: write

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_ONCE: '1'
      TELEGRAM_TEST_ON_START: '0'
      TZ: Asia/Tehran
      PYTHONUNBUFFERED: '1'

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================
      # 2. Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      # ==========================================
      # 3. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # 4. Verify main.py
      # ==========================================
      - name: Verify main.py
        run: |
          echo "=========================================="
          echo "VERIFYING main.py"
          echo "=========================================="

          test -f main.py || {
            echo "ERROR: main.py not found"
            exit 1
          }

          echo "main.py found:"
          ls -lh main.py

          echo ""
          echo "Checking required functions..."

          REQUIRED_FUNCTIONS=(
            "scan_market"
            "analyze_one_symbol"
            "score_bottom_hunter"
            "analyze_higher_timeframe_signal"
            "build_signal_message"
            "calculate_fibonacci_levels"
          )

          for FUNC in "${REQUIRED_FUNCTIONS[@]}"; do
            if grep -qE "^def ${FUNC}\(" main.py; then
              echo "OK: ${FUNC}"
            else
              echo "ERROR: Missing function: ${FUNC}"
              exit 1
            fi
          done

          echo ""
          echo "Checking Python syntax..."

          python -m py_compile main.py

          echo ""
          echo "=========================================="
          echo "main.py verification PASSED"
          echo "=========================================="

      # ==========================================
      # 5. Run scanner
      # ==========================================
      - name: Run Binance scanner
        run: |
          echo "=========================================="
          echo "STARTING CRYPTO SIGNAL BOT"
          echo "=========================================="

          python main.py

      # ==========================================
      # 6. Save bot state
      # ==========================================
      - name: Commit signal state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add signals_state.json signals_history.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update signal state [skip ci]"
          git push
