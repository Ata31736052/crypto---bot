name: Crypto Signal Bot v62

on:
  workflow_dispatch:

  schedule:
    # اجرای دقیقاً هر ساعت
    - cron: "0 * * * *"

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RUN_ONCE: "1"
      TELEGRAM_TEST_ON_START: "0"
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tehran

      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. Python
      # =====================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip


      # =====================================================
      # 3. Dependencies
      # =====================================================
      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            requests \
            pandas \
            numpy \
            pyyaml


      # =====================================================
      # 4. Verify main.py exists
      # =====================================================
      - name: Verify root files
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "🔍 Crypto Signal Bot v62 Verification"
          echo "=============================================="

          test -f main.py

          echo "main.py:"
          ls -lh main.py

          echo
          echo "Python:"
          python --version


      # =====================================================
      # 5. Syntax / AST verification
      # =====================================================
      - name: Python syntax verification
        run: |
          set -euo pipefail

          python -m py_compile main.py

          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("main.py").read_text(
              encoding="utf-8"
          )

          ast.parse(source)

          print("==============================================")
          print("✅ py_compile: PASS")
          print("✅ AST parse: PASS")
          print("Lines:", len(source.splitlines()))
          print("Bytes:", len(source.encode("utf-8")))
          print("==============================================")
          PY


      # =====================================================
      # 6. Version verification
      # =====================================================
      - name: Verify v62
        run: |
          set -euo pipefail

          grep -Fq "v62" main.py

          echo "✅ v62 marker: PASS"


      # =====================================================
      # 7. Professional quality engine verification
      # =====================================================
      - name: Verify professional quality engine
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          source = Path("main.py").read_text(
              encoding="utf-8"
          )

          required = [
              "professional_signal_quality_gate",
              "professional_quality_grade",

              "PRO_MIN_SCORE",
              "PRO_SELL_MIN_SCORE",
              "PRO_BOTTOM_MIN_SCORE",

              "PRO_MIN_QUALITY_POINTS",
              "PRO_BOTTOM_MIN_QUALITY_POINTS",

              "PRO_MAX_EMA21_DISTANCE",
              "PRO_MAX_EMA200_DISTANCE",

              "PRO_MIN_VOLUME_RATIO",
              "PRO_MIN_30M_CONFIRMATIONS",
              "PRO_MIN_HTF_ALIGNMENT",

              "PRO_MIN_1H_ADX",
              "PRO_SELL_MIN_1H_ADX",

              "PRO_MIN_RR_TP1",
              "PRO_MIN_RR_TP2",

              "ADX",
              "volume",
              "30M",
              "EMA21",
              "EMA200",
              "momentum",
              "quality",
              "sell",
          ]

          missing = [
              item for item in required
              if item.lower() not in source.lower()
          ]

          if missing:
              raise SystemExit(
                  "❌ Missing v62 quality markers: "
                  + ", ".join(missing)
              )

          print("==============================================")
          print("✅ Professional quality engine: PASS")
          print("==============================================")
          PY


      # =====================================================
      # 8. BTC protection
      # =====================================================
      - name: Verify BTC context-only protection
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          source = Path("main.py").read_text(
              encoding="utf-8"
          ).lower()

          required = [
              "btc_symbol",
              "btcusdt",
              "btc_context_only",
              "context",
          ]

          missing = [
              item for item in required
              if item not in source
          ]

          if missing:
              raise SystemExit(
                  "❌ BTC protection markers missing: "
                  + ", ".join(missing)
              )

          print("✅ BTC context-only protection: PASS")
          PY


      # =====================================================
      # 9. Import test
      # =====================================================
      - name: Module import test
        run: |
          set -euo pipefail

          python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location(
              "crypto_signal_bot",
              "main.py"
          )

          if spec is None or spec.loader is None:
              raise SystemExit(
                  "❌ Could not create import specification"
              )

          module = importlib.util.module_from_spec(spec)

          spec.loader.exec_module(module)

          print("==============================================")
          print("✅ Module import: PASS")
          print("==============================================")
          PY


      # =====================================================
      # 10. Root behavioral tests
      # =====================================================
      - name: Run v62 root tests
        run: |
          set -euo pipefail

          if [ -f test_v62_root.py ]; then
              python test_v62_root.py
          else
              echo "❌ test_v62_root.py is missing"
              exit 1
          fi


      # =====================================================
      # 11. Final verification
      # =====================================================
      - name: Final v62 verification
        run: |
          set -euo pipefail

          echo
          echo "=============================================="
          echo "✅ Crypto Signal Bot v62 VERIFICATION PASSED"
          echo "=============================================="

          echo
          echo "Quality protection:"
          echo "  Score gate        : ENABLED"
          echo "  Quality grade     : ENABLED"
          echo "  ADX filter        : ENABLED"
          echo "  Volume filter     : ENABLED"
          echo "  30M confirmation  : ENABLED"
          echo "  HTF confirmation  : ENABLED"
          echo "  EMA21 protection  : ENABLED"
          echo "  EMA200 protection : ENABLED"
          echo "  R:R protection    : ENABLED"
          echo "  SELL protection   : ENABLED"
          echo "  BTC context-only  : ENABLED"

          echo
          echo "=============================================="


      # =====================================================
      # 12. Run bot
      # =====================================================
      - name: Run Crypto Signal Bot v62
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "🚀 STARTING CRYPTO SIGNAL BOT v62"
          echo "=============================================="

          python main.py

          echo
          echo "=============================================="
          echo "🏁 BOT FINISHED"
          echo "=============================================="
