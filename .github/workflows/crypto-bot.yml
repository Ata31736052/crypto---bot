name: Crypto Signal Bot v62

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tehran
      RUN_ONCE: "1"
      TELEGRAM_TEST_ON_START: "0"
      PYTHONUNBUFFERED: "1"
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      # =========================================================
      # 1) CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2) PYTHON
      # =========================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # =========================================================
      # 3) DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy pyyaml

      # =========================================================
      # 4) TELEGRAM SECRETS
      # =========================================================
      - name: Check Telegram secrets
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_TOKEN:-}" ]; then
            echo "❌ TELEGRAM_TOKEN is missing"
            exit 1
          fi

          if [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "❌ TELEGRAM_CHAT_ID is missing"
            exit 1
          fi

          echo "✅ Telegram secrets are available"

      # =========================================================
      # 5) MAIN FILE
      # =========================================================
      - name: Check main.py
        run: |
          set -euo pipefail

          test -f main.py

          echo "✅ main.py exists"
          echo "Size:"
          wc -c main.py

      # =========================================================
      # 6) PYTHON COMPILE
      # =========================================================
      - name: Python compile check
        run: |
          set -euo pipefail

          python -m py_compile main.py

          echo "✅ main.py compiled successfully"

      # =========================================================
      # 7) AST + V62 ROOT MARKERS
      # =========================================================
      - name: AST and v62 marker check
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("main.py")
          source = path.read_text(encoding="utf-8")

          ast.parse(source)

          required_markers = [
              "professional_signal_quality_gate",
              "professional_quality_grade",

              "PRO_MIN_SCORE = 90",
              "PRO_SELL_MIN_SCORE = 92",
              "PRO_BOTTOM_MIN_SCORE = 90",

              "PRO_MIN_QUALITY_POINTS = 14",
              "PRO_BOTTOM_MIN_QUALITY_POINTS = 14",

              "PRO_MIN_1H_ADX = 23.0",
              "PRO_MIN_REVERSAL_ADX = 18.0",
              "PRO_MIN_30M_ADX = 17.0",

              "PRO_MIN_VOLUME_RATIO = 1.35",
              "PRO_SELL_MIN_VOLUME_RATIO = 1.50",

              "PRO_MIN_30M_CONFIRMATIONS = 6",
              "PRO_SELL_MIN_30M_CONFIRMATIONS = 6",

              "PRO_MAX_EMA21_DISTANCE = 4.00",
              "PRO_MAX_EMA200_DISTANCE = 12.00",

              "PRO_MIN_RR_TP1 = 1.80",
              "PRO_MIN_RR_TP2 = 2.40",

              "PRO_SELL_MIN_HTF_ALIGNMENT = 2",

              "BTC_CONTEXT_ONLY",
              "BTC_SYMBOL",
          ]

          missing = [
              marker
              for marker in required_markers
              if marker not in source
          ]

          if missing:
              print("❌ Missing required v62 markers:")
              for item in missing:
                  print(" -", item)
              raise SystemExit(1)

          print("✅ AST check passed")
          print("✅ All required v62 root markers found")
          PY

      # =========================================================
      # 8) IMPORT TEST
      # =========================================================
      - name: Import test
        run: |
          set -euo pipefail

          python - <<'PY'
          import main

          print("✅ main.py imported successfully")
          PY

      # =========================================================
      # 9) ROOT PROFESSIONAL QUALITY TESTS
      # =========================================================
      - name: Root behavior tests
        run: |
          set -euo pipefail

          python - <<'PY'
          import numpy as np
          import pandas as pd
          import main

          print("=" * 70)
          print("V62 ROOT PROFESSIONAL QUALITY TESTS")
          print("=" * 70)

          # -----------------------------------------------------
          # Synthetic 1H data
          # -----------------------------------------------------
          n = 120

          close = np.linspace(100, 130, n)

          df = pd.DataFrame({
              "close": close,
              "ema9": close * 1.004,
              "ema21": close * 0.995,
              "ema50": close * 0.970,
              "ema200": close * 0.900,

              "adx": np.full(n, 30.0),
              "volume_ratio": np.full(n, 2.0),

              "distance_ema21": np.full(n, 0.9),

              "rsi": np.full(n, 58.0),
              "rsi_prev": np.full(n, 55.0),

              "plus_di": np.full(n, 28.0),
              "minus_di": np.full(n, 16.0),

              "macd": np.full(n, 2.0),
              "macd_signal": np.full(n, 1.0),
             
