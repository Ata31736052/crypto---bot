name: Crypto Signal Bot

on:
  workflow_dispatch:

  schedule:
    - cron: '0,30 * * * *'
      timezone: 'Asia/Tehran'

permissions:
  contents: write

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_ONCE: '1'
      TELEGRAM_TEST_ON_START: '0'
      TZ: Asia/Tehran
      PYTHONUNBUFFERED: '1'

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================
      # 2. Setup Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      # ==========================================
      # 3. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # 4. Verify main.py
      # ==========================================
      - name: Verify main.py
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING main.py"
          echo "=========================================="

          if [ ! -f main.py ]; then
            echo "ERROR: main.py not found"
            exit 1
          fi

          echo ""
          echo "main.py:"
          ls -lh main.py

          echo ""
          echo "Python version:"
          python --version

          # ------------------------------------------
          # Python syntax check
          # ------------------------------------------
          echo ""
          echo "Checking Python syntax..."

          python -m py_compile main.py

          echo "Python syntax: OK"

          # ------------------------------------------
          # File size check
          # ------------------------------------------
          echo ""
          echo "Checking main.py size..."

          SIZE=$(stat -c%s main.py)

          if [ "$SIZE" -lt 10000 ]; then
            echo "ERROR: main.py appears too small: ${SIZE} bytes"
            exit 1
          fi

          echo "main.py size: ${SIZE} bytes"

          # ------------------------------------------
          # v50 BTC exclusion check
          # ------------------------------------------
          echo ""
          echo "Checking BTC exclusion fix..."

          if ! grep -q "common_coins.discard(BTC_SYMBOL)" main.py; then
            echo "ERROR: BTC exclusion fix NOT found."
            echo "The deployed main.py is not the expected v50 Final version."
            exit 1
          fi

          echo "OK: BTC exclusion fix found."

          # ------------------------------------------
          # confirmations initialization check
          # ------------------------------------------
          echo ""
          echo "Checking confirmations initialization..."

          if ! grep -q "confirmations = 0" main.py; then
            echo "ERROR: confirmations initialization fix NOT found."
            exit 1
          fi

          echo "OK: confirmations initialization found."

          # ------------------------------------------
          # Final verification
          # ------------------------------------------
          echo ""
          echo "=========================================="
          echo "main.py verification PASSED"
          echo "Expected v50 fixes are present."
          echo "=========================================="

      # ==========================================
      # 5. Run Binance scanner
      # ==========================================
      - name: Run Binance scanner
        run: |
          set -e

          echo "=========================================="
          echo "STARTING CRYPTO SIGNAL BOT"
          echo "=========================================="

          echo ""
          echo "Current time:"
          date

          echo ""
          echo "Repository commit:"
          git rev-parse --short HEAD

          echo ""
          echo "Running main.py..."

          python main.py

          echo ""
          echo "=========================================="
          echo "CRYPTO SIGNAL BOT FINISHED"
          echo "=========================================="

      # ==========================================
      # 6. Save bot state
      # ==========================================
      - name: Commit signal state
        if: always()
        run: |
          set -e

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add signals_state.json signals_history.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update signal state [skip ci]"
          git push
