name: Crypto Bot Diagnostics Tests

on:
  push:
    branches: [main, backtest/main-engine-baseline-180d, backtest/divergence-reuse-ab-20261013-run]
  pull_request:
    branches: [main, backtest/main-engine-baseline-180d]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_ONCE: '0'
      DRY_RUN: '1'
      TELEGRAM_TEST_ON_START: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout proposed code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install requests pandas numpy
          fi
      - name: Verify source and compile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('main.py').read_text(encoding='utf-8')
          checks = {
              'Telegram dry-run default is safe': 'DRY_RUN = os.getenv("DRY_RUN", "1")' in source,
              'deployment identity exists': 'DEPLOYMENT_ID =' in source,
              'outcome coverage self-test exists': 'def run_v63_14_14_finalization_metrics_self_test():' in source,
              'shared divergence self-test exists': 'def run_divergence_reuse_self_test():' in source,
              'missing hourly candles fail closed': 'def _outcome_window_has_complete_candles(' in source,
              'finite OHLCV validation exists': 'def validate_finite_ohlcv(' in Path('historical_backtest.py').read_text(encoding='utf-8'),
              'score gate unchanged': re.search(r'^PRO_MIN_SCORE\s*=\s*90\s*$', source, re.M) is not None,
              'ADX gate unchanged': re.search(r'^PRO_MIN_1H_ADX\s*=\s*23\.0\s*$', source, re.M) is not None,
              'volume gate unchanged': re.search(r'^PRO_MIN_VOLUME_RATIO\s*=\s*1\.35\s*$', source, re.M) is not None,
          }
          if 'v63.14.21-early-entry-guard-20261012' in source:
              checks.update({
                  'early-entry guard exists': 'def early_entry_rejection(' in source,
                  'early-entry guard wired into final quality gate': 'early_reject = early_entry_rejection(' in source,
                  'early-entry regression cases exist': 'late impulse' in source and 'BUY late entry' in source,
              })
          for label, passed in checks.items():
              print(f"{'PASS' if passed else 'FAIL'}: {label}")
          failed = [label for label, passed in checks.items() if not passed]
          if failed:
              raise SystemExit('Source verification failed: ' + ', '.join(failed))
          PY
          python -m py_compile main.py historical_backtest.py portfolio_ledger.py
          echo "Python compile (main + historical backtest + portfolio ledger): PASS"
      - name: Run deterministic historical backtest boundary tests (no network, no Telegram)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import historical_backtest as backtest
          tests = [
              ("closed end cutoff", backtest.closed_end_cutoff_self_test),
              ("fetch clock and boundary execution candle", backtest.fetch_clock_boundary_self_test),
              ("boundary execution candle validation", backtest.boundary_execution_candle_self_test),
              ("finite OHLCV validation", backtest.finite_ohlcv_self_test),
              ("historical exit ambiguity", backtest.simulate_self_test),
          ]
          for label, test in tests:
              assert test() is True, f"{label} failed"
              print(f"PASS: {label}")
          print("ALL HISTORICAL BACKTEST BOUNDARY TESTS: PASS")
          PY
      - name: Run regression tests (no market scan, no Telegram)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import main
          tests = [
              ('v63.9 diagnostic integrity', main.run_v63_9_diagnostic_integrity_self_test),
              ('v63.10 root fix', main.run_v63_10_root_fix_self_test),
              ('v63.12 root fix', main.run_v63_12_root_fix3_self_test),
              ('v63.14 diagnostic trace', main.run_v63_14_diagnostic_trace_self_test),
              ('v63.14.1 root fix', main.run_v63_14_1_root_fix_self_test),
              ('v63.14.2 Bottom RSI regression', main.run_v63_14_2_bottom_rsi_self_test),
              ('v63.14.3 outcome boundary + historical freshness', main.run_v63_14_3_outcome_boundary_self_test),
              ('v63.14.7 final gate consistency', main.run_v63_14_7_final_gate_consistency_self_test),
              ('v63.14.8 confirmation diagnostic truth', main.run_v63_14_8_confirmation_diagnostic_self_test),
              ('v63.14.9 engine rejection trace', main.run_v63_14_9_engine_rejection_trace_self_test),
              ('v63.14.11 analytics scope', main.run_v63_14_11_analytics_scope_self_test),
              ('v63.14.14 outcome candle coverage', main.run_v63_14_14_finalization_metrics_self_test),
              ('shared divergence analysis reuse', main.run_divergence_reuse_self_test),
          ]
          for label, test in tests:
              assert test() is True, f'{label} failed'
              print(f'PASS: {label}')
          if hasattr(main, 'early_entry_rejection'):
              assert main.early_entry_rejection('BUY', 'TREND', 108.0, 100.0, 8.0, 60.0) is None
              assert 'late entry' in main.early_entry_rejection('BUY', 'TREND', 111.0, 100.0, 8.0, 60.0)
              assert 'overheated' in main.early_entry_rejection('BUY', 'TREND', 106.0, 100.0, 8.0, 72.0)
              assert main.early_entry_rejection('SELL', 'TREND', 120.0, 100.0, 8.0, 80.0) is None
              assert 'late impulse' in main.early_entry_rejection('BUY', 'BREAKOUT', 125.0, 120.0, 10.0, 68.0, [100, 108, 118, 125])
              print('PASS: v63.14.21 early-entry guard regression')
          print('ALL REGRESSION SELF-TESTS: PASS')
          PY