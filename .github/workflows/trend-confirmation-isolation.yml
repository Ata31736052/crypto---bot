name: 1H TREND Confirmation Isolation
on:
  push:
    branches:
      - fix/1h-trend-no-30m-confirm-20261109
    paths:
      - 'main.py'
      - '.github/workflows/trend-confirmation-isolation.yml'
permissions:
  contents: read
jobs:
  targeted-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_ONCE: '0'
      TELEGRAM_TEST_ON_START: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas numpy
      - name: Compile source
        run: python -m py_compile main.py
      - name: Verify isolated timeframe behavior
        run: |
          python - <<'PY'
          import main
          assert main.run_1h_trend_confirmation_isolation_self_test() is True
          assert main.run_htf_alignment_status_self_test() is True
          print("PASS: 1H TREND is independent of 30M confirmation")
          print("PASS: BREAKOUT and BOTTOM_HUNTER retain 30M data requirement")
          print("PASS: HTF diagnostic classification remains intact")
          PY
