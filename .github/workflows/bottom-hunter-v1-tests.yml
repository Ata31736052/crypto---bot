name: Bottom Hunter v1 unit tests

on:
  pull_request:
    paths:
      - "bottom_hunter_v1/**"
      - "tests/test_bottom_hunter_v1.py"
      - ".github/workflows/bottom-hunter-v1-tests.yml"
  push:
    branches:
      - "experiment/bottom-hunter-from-scratch-v1"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - run: python -m unittest discover -s tests -p "test_bottom_hunter_v1.py" -v
