      - name: Root behavior tests
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")
          tree = ast.parse(source)

          print("=" * 70)
          print("V62 ROOT PROFESSIONAL QUALITY TESTS")
          print("=" * 70)

          functions = {
              node.name
              for node in ast.walk(tree)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          if "professional_signal_quality_gate" not in functions:
              raise AssertionError(
                  "professional_signal_quality_gate() is missing"
              )

          print("✅ professional_signal_quality_gate() found")

          values = {}

          for node in ast.walk(tree):
              if not isinstance(node, ast.Assign):
                  continue

              if len(node.targets) != 1:
                  continue

              target = node.targets[0]

              if not isinstance(target, ast.Name):
                  continue

              try:
                  value = ast.literal_eval(node.value)
              except Exception:
                  continue

              values[target.id] = value

          required = [
              "PRO_MIN_SCORE",
              "PRO_SELL_MIN_SCORE",
              "PRO_BOTTOM_MIN_SCORE",
              "PRO_MIN_QUALITY_POINTS",
              "PRO_BOTTOM_MIN_QUALITY_POINTS",
              "PRO_MIN_1H_ADX",
              "PRO_MIN_REVERSAL_ADX",
              "PRO_MIN_30M_ADX",
              "PRO_MIN_VOLUME_RATIO",
              "PRO_SELL_MIN_VOLUME_RATIO",
              "PRO_MIN_30M_CONFIRMATIONS",
              "PRO_SELL_MIN_30M_CONFIRMATIONS",
              "PRO_MAX_EMA21_DISTANCE",
              "PRO_MAX_EMA200_DISTANCE",
              "PRO_MIN_RR_TP1",
              "PRO_MIN_RR_TP2",
          ]

          for name in required:
              if name not in values:
                  raise AssertionError(
                      f"Required quality constant missing: {name}"
                  )

              print(f"✅ {name} = {values[name]}")

          assert values["PRO_MIN_SCORE"] >= 90
          assert values["PRO_SELL_MIN_SCORE"] >= 90
          assert values["PRO_BOTTOM_MIN_SCORE"] >= 90

          assert values["PRO_MIN_QUALITY_POINTS"] >= 14
          assert values["PRO_BOTTOM_MIN_QUALITY_POINTS"] >= 14

          assert values["PRO_MIN_1H_ADX"] >= 23
          assert values["PRO_MIN_REVERSAL_ADX"] >= 18
          assert values["PRO_MIN_30M_ADX"] >= 17

          assert values["PRO_MIN_VOLUME_RATIO"] >= 1.35
          assert values["PRO_SELL_MIN_VOLUME_RATIO"] >= 1.50

          assert values["PRO_MIN_30M_CONFIRMATIONS"] >= 6
          assert values["PRO_SELL_MIN_30M_CONFIRMATIONS"] >= 6

          assert values["PRO_MAX_EMA21_DISTANCE"] <= 4.0
          assert values["PRO_MAX_EMA200_DISTANCE"] <= 12.0

          assert values["PRO_MIN_RR_TP1"] >= 1.80
          assert values["PRO_MIN_RR_TP2"] >= 2.40

          print("✅ Strict quality thresholds passed")

          protections = [
              "volume_ratio",
              "adx",
              "distance_ema21",
              "PRO_MAX_EMA200_DISTANCE",
              "PRO_MIN_RR_TP1",
              "PRO_MIN_RR_TP2",
          ]

          for item in protections:
              if item not in source:
                  raise AssertionError(
                      f"Required protection missing: {item}"
                  )

              print(f"✅ Protection found: {item}")

          if "BTC_CONTEXT_ONLY" not in source:
              raise AssertionError("BTC_CONTEXT_ONLY is missing")

          if "BTC_SYMBOL" not in source:
              raise AssertionError("BTC_SYMBOL is missing")

          print("✅ BTC context protection found")

          print("=" * 70)
          print("✅ ALL V62 ROOT TESTS PASSED")
          print("=" * 70)
          PY      - name: Binance connectivity test
        run: |
          set -euo pipefail

          python - <<'PY'
          import requests

          URL = "https://api.binance.com/api/v3/ping"

          print("=" * 70)
          print("BINANCE CONNECTIVITY TEST")
          print("=" * 70)

          try:
              response = requests.get(
                  URL,
                  timeout=20
              )

              print(f"HTTP status: {response.status_code}")

              response.raise_for_status()

              data = response.json()

              if data != {}:
                  print(f"⚠️ Unexpected Binance response: {data}")
              else:
                  print("✅ Binance API reachable")
                  print("✅ Binance ping successful")

          except requests.RequestException as exc:
              print(f"❌ Binance API connection failed: {exc}")
              raise SystemExit(1)

          print("=" * 70)
          print("✅ BINANCE CONNECTIVITY TEST PASSED")
          print("=" * 70)
          PY      - name: Run Crypto Signal Bot
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "🚀 STARTING CRYPTO SIGNAL BOT v62"
          echo "============================================================"

          echo "Python version:"
          python --version

          echo "Working directory:"
          pwd

          echo "Checking main.py:"
          ls -lh main.py

          echo "RUN_ONCE=${RUN_ONCE}"
          echo "TELEGRAM_TEST_ON_START=${TELEGRAM_TEST_ON_START}"
          echo "TZ=${TZ}"

          echo "============================================================"
          echo "▶️ RUNNING MAIN.PY"
          echo "============================================================"

          python -u main.py

          echo "============================================================"
          echo "✅ BOT FINISHED SUCCESSFULLY"
          echo "============================================================"
