name: Controlled A-B Performance Benchmark
on:
  # Heavy benchmarks are deliberately manual-only. Enter immutable commit SHAs
  # explicitly so ordinary PR updates cannot launch a multi-hour replay.
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Baseline commit SHA (immutable)"
        required: true
        default: "78c3f017c5c51aa745ffa50f58a588e729c37de9"
        type: string
      candidate_sha:
        description: "Candidate commit SHA (immutable)"
        required: true
        default: "55c6073bf018126587b62d20d5520e277da0249c"
        type: string
      days:
        description: "Historical period in days"
        required: true
        default: "180"
        type: string
      symbols:
        description: "Comma-separated Binance Spot USDT symbols"
        required: true
        default: "ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,LINKUSDT"
        type: string
      end_time:
        description: "Fixed UTC end timestamp (ISO-8601)"
        required: true
        default: "2026-10-12T00:00:00Z"
        type: string
permissions:
  contents: read
concurrency:
  group: controlled-ab-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  ab-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AB_BASE_SHA: ${{ inputs.base_sha }}
      AB_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      AB_REPEATS: "3"
      BACKTEST_DAYS: ${{ inputs.days }}
      BACKTEST_SYMBOLS: ${{ inputs.symbols }}
      BACKTEST_FEE_BPS: "10"
      BACKTEST_SLIPPAGE_BPS: "5"
      BACKTEST_END_TIME: ${{ inputs.end_time }}
      PYTHONUNBUFFERED: "1"
      TELEGRAM_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      DRY_RUN: "1"
      RUN_ONCE: "0"
    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install one shared dependency environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify fixed inputs and revisions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AB_BASE_SHA"
          test -n "$AB_CANDIDATE_SHA"
          test "$AB_BASE_SHA" != "$AB_CANDIDATE_SHA"
          [[ "$AB_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AB_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BACKTEST_DAYS" =~ ^[0-9]+$ ]]
          test "$BACKTEST_DAYS" -ge 30
          test "$BACKTEST_DAYS" -le 365
          git cat-file -e "$AB_BASE_SHA^{commit}"
          git cat-file -e "$AB_CANDIDATE_SHA^{commit}"
          python - <<'PY'
          import os, pandas, requests
          print("Python shared environment:", os.sys.version)
          print("pandas:", pandas.__version__)
          print("requests:", requests.__version__)
          print("Baseline:", os.environ["AB_BASE_SHA"])
          print("Candidate:", os.environ["AB_CANDIDATE_SHA"])
          print("Fixed window:", os.environ["BACKTEST_END_TIME"], "days=", os.environ["BACKTEST_DAYS"])
          PY
      - name: Run alternating A/B benchmark and exact output checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/ab_benchmark.py
          python scripts/ab_benchmark.py
      - name: Upload A/B timing and output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-ab-benchmark
          path: |
            ab-benchmark-results/
          if-no-files-found: warn
          retention-days: 30
