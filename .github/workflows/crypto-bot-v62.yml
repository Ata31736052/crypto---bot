name: Crypto Signal Bot v63

on:
  workflow_dispatch:

  # GitHub Cron uses UTC.
  # 30 UTC = 00:00 Tehran
  schedule:
    - cron: "30 * * * *"

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Tehran
      RUN_ONCE: "1"
      TELEGRAM_TEST_ON_START: "0"
      PYTHONUNBUFFERED: "1"
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. PYTHON
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip


      # =========================================================
      # 3. DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install requests pandas numpy pyyaml


      # =========================================================
      # 4. TELEGRAM SECRETS
      # =========================================================
      - name: Verify Telegram secrets
        run: |
          set -euo pipefail

          test -n "$TELEGRAM_TOKEN" || {
            echo "❌ TELEGRAM_TOKEN is missing"
            exit 1
          }

          test -n "$TELEGRAM_CHAT_ID" || {
            echo "❌ TELEGRAM_CHAT_ID is missing"
            exit 1
          }

          echo "✅ Telegram secrets: PASS"


      # =========================================================
      # 5. SOURCE CHECK
      # =========================================================
      - name: Verify v63 source
        run: |
          set -euo pipefail

          test -f main.py

          echo "✅ main.py exists"

          python --version

          python -m py_compile main.py

          echo "✅ main.py compile: PASS"


      # =========================================================
      # 6. ROOT QUALITY CHECK
      # =========================================================
      - name: Verify quality gate
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")

          ast.parse(source, filename="main.py")

          tree = ast.parse(source)

          functions = {
              node.name
              for node in ast.walk(tree)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          required_functions = [
              "professional_signal_quality_gate",
          ]

          for name in required_functions:
              if name not in functions:
                  raise SystemExit(
                      f"❌ Missing function: {name}"
                  )

          required_markers = [
              "PRO_MIN_SCORE",
              "PRO_SELL_MIN_SCORE",
              "PRO_BOTTOM_MIN_SCORE",
              "PRO_MIN_QUALITY_POINTS",
              "PRO_BOTTOM_MIN_QUALITY_POINTS",
              "PRO_MIN_1H_ADX",
              "PRO_MIN_VOLUME_RATIO",
              "PRO_MIN_30M_CONFIRMATIONS",
              "PRO_MAX_EMA21_DISTANCE",
              "PRO_MAX_EMA200_DISTANCE",
              "PRO_MIN_RR_TP1",
              "PRO_MIN_RR_TP2",
              "TP1_RR = 1.80",
          ]

          missing = [
              x
              for x in required_markers
              if x not in source
          ]

          if missing:
              raise SystemExit(
                  "❌ Missing v63 markers:\n"
                  + "\n".join(
                      f" - {x}" for x in missing
                  )
              )

          print("========================================")
          print("✅ V63 ROOT QUALITY CHECK: PASS")
          print("========================================")
          print("TP1_RR = 1.80 confirmed")
          print("Professional minimum TP1 RR = 1.80")
          print("No RR mismatch remains")
          PY


      # =========================================================
      # 7. IMPORT TEST
      # =========================================================
      - name: Import main.py
        run: |
          set -euo pipefail

          python - <<'PY'
          import main

          assert main.RUN_ONCE is True
          assert main.TIMEFRAME_MAIN == "1h"
          assert main.TIMEFRAME_CONFIRM == "30m"

          assert main.TP1_RR == 1.80
          assert main.TP2_RR == 2.80

          print("========================================")
          print("✅ IMPORT + CONFIGURATION: PASS")
          print("========================================")
          print("TP1_RR:", main.TP1_RR)
          print("TP2_RR:", main.TP2_RR)
          PY


      # =========================================================
      # 8. RUN BOT
      # =========================================================
      - name: Run Crypto Signal Bot v63
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "🚀 STARTING CRYPTO SIGNAL BOT v63"
          echo "============================================================"

          date

          python -u main.py

          echo "============================================================"
          echo "✅ CRYPTO SIGNAL BOT v63 FINISHED"
          echo "============================================================"
