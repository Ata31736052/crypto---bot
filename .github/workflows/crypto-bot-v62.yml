name: Crypto Signal Bot v63

on:
  workflow_dispatch:

  # GitHub Cron is UTC.
  # 30 UTC = 00:00 Tehran
  schedule:
    - cron: "30 * * * *"

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Tehran
      RUN_ONCE: "1"
      TELEGRAM_TEST_ON_START: "0"
      PYTHONUNBUFFERED: "1"
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests pandas numpy pyyaml

      - name: Verify Telegram secrets
        run: |
          set -euo pipefail

          test -n "$TELEGRAM_TOKEN" || {
            echo "❌ TELEGRAM_TOKEN is missing"
            exit 1
          }

          test -n "$TELEGRAM_CHAT_ID" || {
            echo "❌ TELEGRAM_CHAT_ID is missing"
            exit 1
          }

          echo "✅ Telegram secrets: PASS"

      - name: Verify main.py
        run: |
          set -euo pipefail

          test -f main.py

          echo "========================================"
          echo "Checking main.py"
          echo "========================================"

          python --version

          python -m py_compile main.py

          echo "✅ main.py exists"
          echo "✅ main.py compile: PASS"

      - name: Verify v63 configuration
        run: |
          set -euo pipefail

          python - <<'PY'
          import importlib.util

          print("========================================")
          print("Loading main.py")
          print("========================================")

          spec = importlib.util.spec_from_file_location(
              "crypto_main",
              "main.py"
          )

          if spec is None or spec.loader is None:
              raise SystemExit("❌ Cannot load main.py")

          main = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(main)

          required = [
              "professional_signal_quality_gate",
              "TP1_RR",
              "TP2_RR",
              "PRO_MIN_RR_TP1",
              "PRO_MIN_RR_TP2",
              "PRO_MIN_SCORE",
              "PRO_SELL_MIN_SCORE",
              "PRO_BOTTOM_MIN_SCORE",
              "PRO_MIN_QUALITY_POINTS",
              "PRO_BOTTOM_MIN_QUALITY_POINTS",
              "PRO_MIN_1H_ADX",
              "PRO_MIN_VOLUME_RATIO",
              "PRO_MIN_30M_CONFIRMATIONS",
              "PRO_MAX_EMA21_DISTANCE",
              "PRO_MAX_EMA200_DISTANCE",
          ]

          print("========================================")
          print("Checking required configuration")
          print("========================================")

          for name in required:
              if not hasattr(main, name):
                  raise SystemExit(
                      f"❌ Missing required item: {name}"
                  )

          print("✅ Required configuration: PASS")

          tp1 = float(main.TP1_RR)
          tp2 = float(main.TP2_RR)
          min_tp1 = float(main.PRO_MIN_RR_TP1)
          min_tp2 = float(main.PRO_MIN_RR_TP2)

          print("")
          print("========================================")
          print("RISK / REWARD CONFIGURATION")
          print("========================================")
          print("TP1_RR         =", tp1)
          print("TP2_RR         =", tp2)
          print("PRO_MIN_RR_TP1 =", min_tp1)
          print("PRO_MIN_RR_TP2 =", min_tp2)
          print("========================================")

          if abs(tp1 - 1.80) > 1e-9:
              raise SystemExit(
                  f"❌ TP1_RR is {tp1}, expected 1.80"
              )

          if abs(tp2 - 2.80) > 1e-9:
              raise SystemExit(
                  f"❌ TP2_RR is {tp2}, expected 2.80"
              )

          if abs(min_tp1 - 1.80) > 1e-9:
              raise SystemExit(
                  f"❌ PRO_MIN_RR_TP1 is {min_tp1}, expected 1.80"
              )

          if abs(min_tp2 - 2.40) > 1e-9:
              raise SystemExit(
                  f"❌ PRO_MIN_RR_TP2 is {min_tp2}, expected 2.40"
              )

          print("")
          print("========================================")
          print("✅ V63 CONFIGURATION: PASS")
          print("========================================")
          print("✅ TP1 generation = 1.80R")
          print("✅ TP1 validation = 1.80R")
          print("✅ TP2 generation = 2.80R")
          print("✅ TP2 validation minimum = 2.40R")
          print("✅ RR mismatch fixed")
          print("========================================")
          PY

      - name: Verify timeframe
        run: |
          set -euo pipefail

          python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location(
              "crypto_main",
              "main.py"
          )

          main = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(main)

          print("========================================")
          print("TIMEFRAME CHECK")
          print("========================================")

          print("Main timeframe    :", main.TIMEFRAME_MAIN)
          print("Confirm timeframe :", main.TIMEFRAME_CONFIRM)

          if main.TIMEFRAME_MAIN != "1h":
              raise SystemExit(
                  f"❌ Main timeframe is {main.TIMEFRAME_MAIN}"
              )

          if main.TIMEFRAME_CONFIRM != "30m":
              raise SystemExit(
                  f"❌ Confirmation timeframe is {main.TIMEFRAME_CONFIRM}"
              )

          print("✅ 1H main timeframe")
          print("✅ 30M confirmation")
          PY

      - name: Run Crypto Signal Bot v63
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "🚀 STARTING CRYPTO SIGNAL BOT v63"
          echo "============================================================"

          echo "Tehran time:"
          date

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Running main.py..."
          echo "============================================================"

          python -u main.py

          echo "============================================================"
          echo "✅ CRYPTO SIGNAL BOT v63 FINISHED"
          echo "============================================================"
