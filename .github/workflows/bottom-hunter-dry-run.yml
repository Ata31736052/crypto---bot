name: Bottom Hunter Binance Dry Run (No Telegram)

on:
  workflow_dispatch:
  push:
    branches:
      - test/bottom-hunter-dry-run-v63-14-16
      - test/daily-bottom-hunter-v63-14-17

permissions:
  contents: read

concurrency:
  group: bottom-hunter-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_ONCE: '1'
      DRY_RUN: '1'
      TELEGRAM_TEST_ON_START: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore signal outcome history
        uses: actions/cache/restore@v4
        with:
          path: signals_history.json
          key: signals-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            signals-history-${{ github.ref_name }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install requests pandas numpy
          fi

      - name: Verify safe mode and compile
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile main.py
          python - <<'PY'
          from pathlib import Path
          source = Path("main.py").read_text(encoding="utf-8")
          checks = {
              "DRY_RUN environment flag exists": 'DRY_RUN = os.getenv("DRY_RUN"' in source,
              "Telegram send boundary blocks dry-run": 'if DRY_RUN:\n        log("DRY_RUN active: Telegram delivery suppressed.")\n        return False' in source,
              "Dry-run distinguishes validated signals from blocked signals": "DRY_RUN VALIDATED:" in source and "READY_BUT_SUPPRESSED_DRY_RUN" in source,
              "Final delivery rejection reasons are specific": "BLOCKED_FINAL_QUALITY_GATE" in source and "BLOCKED_SIGNAL_QUALITY" in source and "BLOCKED_RISK_VALIDATION" in source,
              "Generic Telegram-or-quality rejection removed": "Reason=TELEGRAM_OR_QUALITY_VALIDATION" not in source,
              "Bottom Hunter rejection diagnostic self-test exists": "def run_v63_14_16_bottom_rejection_diagnostic_self_test():" in source,
              "controlled early-reversal exception exists": "def bottom_hunter_adx_gate_pass(" in source and "PRO_BOTTOM_EARLY_ADX_MIN_RAW_SCORE = 95" in source,
              "Bottom Hunter score calibration is explicit": "PRO_BOTTOM_MIN_SCORE = 85" in source and "PRO_BOTTOM_MIN_ADX = 23.0" in source and "PRO_BOTTOM_MIN_VOLUME_RATIO = 1.35" in source,
              "Raw and effective score diagnostics are separate": '"effective_score": round(raw_score, 1)' in source and 'engine_raw_score = safe_float(signal.get("raw_score", raw_score))' in source,
              "Trend and SELL score thresholds unchanged": "PRO_MIN_SCORE = 90" in source and "PRO_SELL_MIN_SCORE = 92" in source,
              "Daily Bottom Hunter uses 1D setup and 4H confirmation": "ENABLE_DAILY_BOTTOM_HUNTER = True" in source and 'data.get("1d"), data.get("4h")' in source and 'signal_timeframe="1d"' in source,
              "entry extension metrics are persisted": '"entry_extension_atr": (' in source and '"ema21_distance_percent": (' in source,
              "configured late-entry RSI threshold is used": 'rsi >= MAX_LATE_ENTRY_RSI_BUY and extension_atr > 0.65' in source,
              "controlled early-confirmation exception exists": "def bottom_hunter_confirmation_gate_pass(" in source and "PRO_BOTTOM_EARLY_MIN_30M_CONFIRMATIONS = 3" in source,
              "early-path blocker diagnostics are wired": "def bottom_hunter_early_confirmation_blockers(" in source and "EARLY_BLOCKED[" in source,
              "early confirmation and blocker diagnostics use pre-cap engine raw score": 'adx, volume, engine_raw_score, momentum_components' in source and 'side, signal_tf, confirmations, adx, volume, engine_raw_score, momentum_components' in source,
              "early ADX exception uses pre-cap engine raw score": 'adx_ok = bottom_hunter_adx_gate_pass(adx, volume, engine_raw_score, momentum_components)' in source,
          }
          for label, ok in checks.items():
              print(f"{'PASS' if ok else 'FAIL'}: {label}")
          if not all(checks.values()):
              raise SystemExit("Dry-run safety/source check failed")
          PY
          echo "Python compile: PASS"

      - name: Run regression self-tests (no scan, no Telegram)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import main
          tests = [
              ("v63.14.20 Daily Bottom Hunter routing", main.run_v63_14_20_daily_bottom_hunter_self_test),
              ("v63.9 diagnostic integrity", main.run_v63_9_diagnostic_integrity_self_test),
              ("v63.12 root fix", main.run_v63_12_root_fix3_self_test),
              ("v63.14 diagnostic trace", main.run_v63_14_diagnostic_trace_self_test),
              ("v63.14.16 Bottom Hunter rejection diagnostics", main.run_v63_14_16_bottom_rejection_diagnostic_self_test),
              ("v63.14.17 controlled early-reversal ADX exception", main.run_v63_14_17_early_reversal_gate_self_test),
              ("v63.14.18 Bottom Hunter score calibration", main.run_v63_14_18_bottom_score_calibration_self_test),
              ("v63.14.19 raw/effective score regression", main.run_v63_14_19_raw_effective_score_self_test),
              ("v63.14.1 root fix", main.run_v63_14_1_root_fix_self_test),
              ("v63.14.2 Bottom RSI regression", main.run_v63_14_2_bottom_rsi_self_test),
              ("v63.14.3 outcome boundary", main.run_v63_14_3_outcome_boundary_self_test),
              ("v63.14.7 final-gate consistency", main.run_v63_14_7_final_gate_consistency_self_test),
              ("v63.14.8 confirmation diagnostic truth", main.run_v63_14_8_confirmation_diagnostic_self_test),
              ("v63.14.9 engine rejection trace", main.run_v63_14_9_engine_rejection_trace_self_test),
              ("v63.14.10 score-grade diagnostic", main.run_v63_14_10_score_grade_diagnostic_self_test),
              ("v63.14.11 analytics scope", main.run_v63_14_11_analytics_scope_self_test),
              ("v63.14.14 outcome coverage", main.run_v63_14_14_finalization_metrics_self_test),
              ("v63.14.22 dry-run outcome recording", main.run_v63_14_22_dry_run_outcome_recording_self_test),
              ("v63.14.23 legacy outcome backfill", main.run_v63_14_23_legacy_outcome_backfill_self_test),
              ("v63.14.25 controlled early confirmation", main.run_v63_14_25_early_confirmation_exception_self_test),
              ("v63.14.26 early-path blockers", main.run_v63_14_26_early_path_blocker_self_test),
              ("v63.14.27 raw-score wiring", main.run_v63_14_27_raw_score_wiring_self_test),
              ("v63.14.28 early ADX raw-score wiring", main.run_v63_14_28_early_adx_raw_score_wiring_self_test),
          ]
          for label, test in tests:
              assert test() is True, f"{label} failed"
              print(f"PASS: {label}")
          if hasattr(main, "early_entry_rejection"):
              assert main.early_entry_rejection("BUY", "TREND", 108.0, 100.0, 8.0, 60.0) is None
              assert "late entry" in main.early_entry_rejection("BUY", "TREND", 111.0, 100.0, 8.0, 60.0)
              assert "overheated" in main.early_entry_rejection("BUY", "TREND", 106.0, 100.0, 8.0, 72.0)
              assert "overheated" in main.early_entry_rejection("BUY", "TREND", 106.0, 100.0, 8.0, 68.0)
              assert main.early_entry_rejection("SELL", "TREND", 120.0, 100.0, 8.0, 80.0) is None
              assert "late impulse" in main.early_entry_rejection("BUY", "BREAKOUT", 125.0, 120.0, 10.0, 68.0, [100, 108, 118, 125])
              print("PASS: v63.14.21 early-entry guard regression")
          print("ALL REGRESSION SELF-TESTS: PASS")
          PY

      - name: Explicit v63.14.26 blocker regression (no scan, no Telegram)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import main
          assert callable(main.bottom_hunter_early_confirmation_blockers)
          assert main.run_v63_14_26_early_path_blocker_self_test() is True
          assert main.run_v63_14_27_raw_score_wiring_self_test() is True
          assert main.run_v63_14_28_early_adx_raw_score_wiring_self_test() is True
          blockers = main.bottom_hunter_early_confirmation_blockers("BUY", "1h", 3, 21.23, 0.66, 100, 2)
          assert "volume<1.50x" in blockers
          assert "raw_score<95" not in blockers
          print("PASS: v63.14.26 explicit blocker regression")
          print("BLOCKERS:", ", ".join(blockers))
          PY

      - name: Scan live Binance data with Telegram delivery disabled
        run: python main.py

      - name: Save signal outcome history
        if: always() && hashFiles('signals_history.json') != ''
        uses: actions/cache/save@v4
        with:
          path: signals_history.json
          key: signals-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload diagnostic logs and outcome history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bottom-hunter-dry-run-${{ github.run_number }}
          path: |
            professional_diagnostics.txt
            symbol_diagnostics.txt
            signals_history.json
          if-no-files-found: warn
          retention-days: 30
