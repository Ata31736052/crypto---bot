name: Crypto Signal Bot v62

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tehran
      RUN_ONCE: "1"
      TELEGRAM_TEST_ON_START: "0"
      PYTHONUNBUFFERED: "1"
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy pyyaml

      - name: Check Telegram secrets
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_TOKEN:-}" ]; then
            echo "❌ TELEGRAM_TOKEN is missing"
            exit 1
          fi
          if [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "❌ TELEGRAM_CHAT_ID is missing"
            exit 1
          fi
          echo "✅ Telegram secrets are available"

      - name: Check main.py
        run: |
          set -euo pipefail
          test -f main.py
          echo "✅ main.py exists"
          wc -c main.py

      - name: Python compile check
        run: |
          set -euo pipefail
          python -m py_compile main.py
          echo "✅ main.py compiled successfully"

      - name: AST and v62 root check
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("main.py")
          source = path.read_text(encoding="utf-8")
          ast.parse(source)
          print("✅ Python AST check passed")

          required_symbols = [
              "professional_signal_quality_gate",
              "professional_quality_grade",
          ]

          for symbol in required_symbols:
              if symbol not in source:
                  raise SystemExit(f"❌ Required symbol missing: {symbol}")
              print(f"✅ Found: {symbol}")

          required_variables = [
              "PRO_MIN_SCORE",
              "PRO_SELL_MIN_SCORE",
              "PRO_BOTTOM_MIN_SCORE",
              "PRO_MIN_QUALITY_POINTS",
              "PRO_BOTTOM_MIN_QUALITY_POINTS",
              "PRO_MIN_1H_ADX",
              "PRO_MIN_REVERSAL_ADX",
              "PRO_MIN_30M_ADX",
              "PRO_MIN_VOLUME_RATIO",
              "PRO_SELL_MIN_VOLUME_RATIO",
              "PRO_MIN_30M_CONFIRMATIONS",
              "PRO_SELL_MIN_30M_CONFIRMATIONS",
              "PRO_MAX_EMA21_DISTANCE",
              "PRO_MAX_EMA200_DISTANCE",
              "PRO_MIN_RR_TP1",
              "PRO_MIN_RR_TP2",
              "PRO_SELL_MIN_HTF_ALIGNMENT",
              "BTC_CONTEXT_ONLY",
              "BTC_SYMBOL",
          ]

          for variable in required_variables:
              if variable not in source:
                  raise SystemExit(f"❌ Missing required variable: {variable}")
              print(f"✅ Found variable: {variable}")

          print("=" * 70)
          print("✅ V62 ROOT SOURCE CHECK PASSED")
          print("=" * 70)
          PY

      - name: Import test
        run: |
          set -euo pipefail
          python - <<'PY'
          import main
          print("✅ main.py imported successfully")
          PY

      - name: Root behavior tests
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("main.py").read_text(encoding="utf-8")
          tree = ast.parse(source)

          print("=" * 70)
          print("V62 ROOT PROFESSIONAL QUALITY TESTS")
          print("=" * 70)

          functions = {
              node.name
              for node in ast.walk(tree)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          assert "professional_signal_quality_gate" in functions, (
              "professional_signal_quality_gate() is missing"
          )
          assert "professional_quality_grade" in functions, (
              "professional_quality_grade() is missing"
          )
          print("✅ Professional quality functions found")

          values = {}
          for node in ast.walk(tree):
              if not isinstance(node, ast.Assign):
                  continue
              if len(node.targets) != 1:
                  continue
              target = node.targets[0]
              if not isinstance(target, ast.Name):
                  continue
              try:
                  value = ast.literal_eval(node.value)
              except Exception:
                  continue
              values[target.id] = value

          required_values = [
              "PRO_MIN_SCORE",
              "PRO_SELL_MIN_SCORE",
              "PRO_BOTTOM_MIN_SCORE",
              "PRO_MIN_QUALITY_POINTS",
              "PRO_BOTTOM_MIN_QUALITY_POINTS",
              "PRO_MIN_1H_ADX",
              "PRO_MIN_REVERSAL_ADX",
              "PRO_MIN_30M_ADX",
              "PRO_MIN_VOLUME_RATIO",
              "PRO_SELL_MIN_VOLUME_RATIO",
              "PRO_MIN_30M_CONFIRMATIONS",
              "PRO_SELL_MIN_30M_CONFIRMATIONS",
              "PRO_MAX_EMA21_DISTANCE",
              "PRO_MAX_EMA200_DISTANCE",
              "PRO_MIN_RR_TP1",
              "PRO_MIN_RR_TP2",
          ]

          for name in required_values:
              if name not in values:
                  raise AssertionError(f"Configuration value not found: {name}")
              print(f"✅ {name} = {values[name]}")

          assert values["PRO_MIN_SCORE"] >= 90
          assert values["PRO_SELL_MIN_SCORE"] >= 90
          assert values["PRO_BOTTOM_MIN_SCORE"] >= 90
          assert values["PRO_MIN_QUALITY_POINTS"] >= 14
          assert values["PRO_BOTTOM_MIN_QUALITY_POINTS"] >= 14
          assert values["PRO_MIN_1H_ADX"] >= 23
          assert values["PRO_MIN_REVERSAL_ADX"] >= 18
          assert values["PRO_MIN_30M_ADX"] >= 17
          assert values["PRO_MIN_VOLUME_RATIO"] >= 1.35
          assert values["PRO_SELL_MIN_VOLUME_RATIO"] >= 1.50
          assert values["PRO_MIN_30M_CONFIRMATIONS"] >= 6
          assert values["PRO_SELL_MIN_30M_CONFIRMATIONS"] >= 6
          assert values["PRO_MAX_EMA21_DISTANCE"] <= 4.0
          assert values["PRO_MAX_EMA200_DISTANCE"] <= 12.0
          assert values["PRO_MIN_RR_TP1"] >= 1.80
          assert values["PRO_MIN_RR_TP2"] >= 2.40
          print("✅ Strict quality thresholds passed")

          protections = [
              "volume_ratio",
              "adx",
              "distance_ema21",
              "PRO_MAX_EMA200_DISTANCE",
              "PRO_MIN_RR_TP1",
              "PRO_MIN_RR_TP2",
          ]

          for item in protections:
              assert item in source, f"Required protection missing: {item}"
              print(f"✅ Protection found: {item}")

          assert "BTC_CONTEXT_ONLY" in source
          assert "BTC_SYMBOL" in source
          print("✅ BTC context protection found")

          print("=" * 70)
          print("✅ ALL V62 ROOT TESTS PASSED")
          print("=" * 70)
          PY

      - name: Binance connectivity test
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests
          url = "https://api.binance.com/api/v3/ping"
          response = requests.get(url, timeout=15)
          response.raise_for_status()
          print("✅ Binance API reachable")
          print(response.text)
          PY

      - name: Run Crypto Signal Bot
        run: |
          set -euo pipefail
          echo "============================================================"
          echo "🚀 STARTING CRYPTO SIGNAL BOT v62"
          echo "============================================================"
          python main.py
          echo "============================================================"
          echo "✅ BOT FINISHED SUCCESSFULLY"
          echo "============================================================"
