name: Crypto Signal Bot v63.6

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RUN_ONCE: "1"
      TELEGRAM_TEST_ON_START: "0"
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tehran
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests pandas numpy pyyaml

      - name: Verify deployed v63.6 truthful diagnostic build
        run: |
          set -euo pipefail
          test -f main.py
          python -m py_compile main.py
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path("main.py").read_text(encoding="utf-8")
          ast.parse(source, filename="main.py")
          required = [
              'Version: 2026-10-04 v63.6 | TRUTHFUL PROFESSIONAL DIAGNOSTICS',
              'DEPLOYMENT_ID = "v63.6-truthful-professional-diagnostics-20261004"',
              'record_professional_rejection',
              'professional_reject_details',
              'professional_quality_breakdown',
              'Professional REJECT SUMMARY',
              'PRO_MIN_SCORE = 90',
              'PRO_MIN_QUALITY_POINTS = 15',
              'required_grade = "A+"',
              'professional_signal_quality_gate',
              'final_telegram_quality_gate',
              'validate_risk_levels',
          ]
          missing = [x for x in required if x not in source]
          if missing:
              raise SystemExit("Missing v63.6 deployment markers: " + ", ".join(missing))
          print("DEPLOYMENT SOURCE: v63.6-truthful-professional-diagnostics-20261004")
          print("AST + v63.6 truthful diagnostic markers: PASS")
          print("Lines:", len(source.splitlines()))
          print("Bytes:", len(source.encode("utf-8")))
          PY

      - name: Import and diagnostic self-test
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("crypto_signal_bot", "main.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.DEPLOYMENT_ID == "v63.6-truthful-professional-diagnostics-20261004"
          assert callable(module.professional_signal_quality_gate)
          assert callable(module.final_telegram_quality_gate)
          assert callable(module.record_professional_rejection)

          diagnostic = {}
          signal = {
              "signal": "BUY",
              "signal_mode": "TREND",
              "score": 88,
              "professional_quality_breakdown": {
                  "raw_score": 88,
                  "quality_points": 11,
                  "quality_score": 82,
                  "grade": "C",
                  "adx": 19.5,
                  "volume_ratio": 1.10,
                  "confirmations_30m": 4,
                  "required_30m": 6,
                  "htf_alignment": 0,
                  "required_htf_alignment": 1,
                  "rr_tp1": 1.80,
                  "rr_tp2": 2.40,
                  "reject_reasons": ["low volume"],
              },
          }
          module.record_professional_rejection(diagnostic, "TEST", signal, ["low volume"], 82)
          assert diagnostic["professional_score_80_89"] == 1
          assert diagnostic["professional_quality_points_9_11"] == 1
          assert diagnostic["professional_reject_details"][0]["adx"] == 19.5
          assert diagnostic["professional_reject_details"][0]["raw_score"] == 88
          print("IMPORT + DIAGNOSTIC SELF-TEST: PASS")
          PY

      - name: Run Crypto Signal Bot v63.6
        run: |
          set -euo pipefail
          python main.py
