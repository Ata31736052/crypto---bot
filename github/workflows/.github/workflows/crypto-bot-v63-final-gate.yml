name: Crypto Signal Bot v63

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RUN_ONCE: "1"
      TELEGRAM_TEST_ON_START: "0"
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tehran
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests pandas numpy pyyaml

      - name: Verify and compile v63
        run: |
          set -euo pipefail
          test -f main.py
          python -m py_compile main.py
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path("main.py").read_text(encoding="utf-8")
          ast.parse(source, filename="main.py")
          required = [
              "final_telegram_quality_gate",
              "professional_signal_quality_gate",
              "professional_filter",
              "professional_quality_grade",
              "A+",
              "validate_risk_levels",
          ]
          missing = [x for x in required if x not in source]
          if missing:
              raise SystemExit("Missing required v63 gate markers: " + ", ".join(missing))
          print("AST + FINAL TELEGRAM GATE: PASS")
          print("Lines:", len(source.splitlines()))
          print("Bytes:", len(source.encode("utf-8")))
          PY

      - name: Import test
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("crypto_signal_bot", "main.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert callable(module.final_telegram_quality_gate)
          print("Import + final gate function: PASS")
          PY

      - name: Run Crypto Signal Bot v63
        run: |
          set -euo pipefail
          python main.py
